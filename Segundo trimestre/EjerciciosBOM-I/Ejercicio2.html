<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo</title>
</head>
<body onload ="mensajeRedireccion()">
   <h1> <textarea name="mensaje"></textarea></h1>
</body>
</html>
<script>
 function mensajeRedireccion(){
    var mensajito = "Cambiando de pagina mi rey 1 2 3 4 5";
    var i = 27;

    var timer = setInterval(() => {
        document.getElementsByTagName('textarea')[0].value = mensajito.slice(0, i++);
        if (i === 37) {
        clearInterval(timer);
        window.location.href = "http://www.iestetuan.es";
        }
    }, 500);

   
    
 }
   
</script>
